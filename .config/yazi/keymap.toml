[[mgr.prepend_keymap]]
on = "<F1>"
run = 'shell --block "/Users/vishudh/.config/cheat/cheat.sh"'
desc = "Open cheat sheet"


# vcs-files plugin
# keymap.toml
[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "plugin vcs-files"
desc = "Show Git file changes"


# Drag IN — copy dropped file into cwd
[[mgr.prepend_keymap]]
on   = ["<C-y>"]
run  = "plugin drag-copy"
desc = "Drag-in: copy dropped file to cwd"

# Drag IN — move dropped file into cwd
[[mgr.prepend_keymap]]
on   = ["<C-x>"]
run  = "plugin drag-copy -- move"
desc = "Drag-in: move dropped file to cwd"

# Drag OUT — reveal in Finder so you can drag out
[[mgr.prepend_keymap]]
on   = ["<C-f>"]
run  = "shell -- open -R %s"
desc = "Reveal in Finder (drag out)"


# Close input by one Esc press
# [[input.prepend_keymap]]
# on   = "<Esc>"
# run  = "close"
# desc = "Cancel input"


# cd back to the root of the current Git repository
[[mgr.prepend_keymap]]
on = [ "g", "t" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'


# Preview files with the system Quick Look
[[mgr.prepend_keymap]]
on = "<C-p>"
run = "shell -- qlmanage -p %s"


# toggle-pane plugin
# maximise/restore preview
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"


# smart-paste plugin
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"


# filter-type plugin
[[mgr.prepend_keymap]]
on = ["g", "i"]
run = "plugin filter-type public.image"
desc = "Filter images"

[[mgr.prepend_keymap]]
on = ["g", "m"]
run = "plugin filter-type public.movie"
desc = "Filter movies"

[[mgr.prepend_keymap]]
on = ["g", "a"]
run = "plugin filter-type public.audio"
desc = "Filter audio"

[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "plugin filter-type public.folder"
desc = "Filter folders"

[[mgr.prepend_keymap]]
on = ["g", "p"]
run = "plugin filter-type com.adobe.pdf"
desc = "Filter PDFs"

[[mgr.prepend_keymap]]
on = ["g", "s"]
run = "plugin filter-type public.source-code"
desc = "Filter code"

[[mgr.prepend_keymap]]
on = ["g", "z"]
run = "plugin filter-type public.archive"
desc = "Filter archives"
