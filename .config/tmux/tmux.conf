# --- Stolen from aadarwal ---

# General
set -g history-limit 50000  # more scrollback
set -g escape-time 0
set -g focus-events on
set -g allow-rename off

# Window navigation
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- End Stolen ---


# --- General Settings ---

# Mouse support
set -g mouse on

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Better colors
set -g default-terminal 'tmux-256color'
set -sa terminal-features ',xterm-ghostty:RGB'

# Enable extended keys (for better support of certain key combinations)
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Move status bar to the top
set -g status-position top

# ghostty-ai-themes transparency (disabled)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g allow-passthrough all

# Better copying
setw -g mode-keys vi


# --- Keybindings ---

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix  # for nested tmux sessions (eg. tmux in ssh)

# Reload config with prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display 'Reloaded'

# Pane Controls
bind h split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

# Window Controls
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-S-H swap-window -t -1 \; select-window -t -1
bind -n M-S-L swap-window -t +1 \; select-window -t +1

# Better copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel \; display-message "Copied to clipboard"


# --- Plugins ---

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'

# Dracula plugin settings
# spr causing issues
set -g @dracula-plugins 'compact-alt git weather battery time'
set -g @dracula-refresh-rate 2
set -g @dracula-time-format '%a %-d %b %H:%M'
set -g @dracula-battery-label false
set -g @dracula-show-battery-status true
set -g @dracula-show-fahrenheit false
set -g @dracula-fixed-location 'La Jolla'
set -g @dracula-weather-colors 'white dark_gray'
set -g @dracula-git-show-repo-name true
set -g @dracula-git-colors 'orange dark_gray'
# set -g @dracula-spr-pause-icon '󰏤 '
set -g @dracula-show-empty-plugins false
set -g @dracula-narrow-plugins 'compact-alt weather battery time'
set -g @dracula-compact-min-width 130

run 'tpack init'


# --- Plugin Overrides ---

# Pane border (overrides dracula/tmux)
set -g pane-border-indicators arrows
set -g pane-active-border-style 'fg=#ff79c6'

# Transparent bar background (overrides dracula/tmux)
set -g status-style 'bg=default'
set -g window-status-separator '#[bg=#44475a] '
set -g window-status-format "#[fg=#f8f8f2]#[bg=#44475a] #I #W "
set -g window-status-current-format "#[fg=#f8f8f2]#[bg=#6272a4] #I #W "
